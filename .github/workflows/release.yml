name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen, dass der Release-Schlüssel hinterlegt ist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release abgebrochen: Es fehlen GitHub-Secrets:$missing. Ohne Release-Schlüssel würde die APK mit dem Debug-Schlüssel signiert. Siehe README, Abschnitt Release."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Keystore decodieren
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/haven-release.jks"
          echo "HAVEN_KEYSTORE=$RUNNER_TEMP/haven-release.jks" >> "$GITHUB_ENV"

      - name: Tag und pubspec.yaml vergleichen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' pubspec.yaml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Der Tag v$tag passt nicht zur Version $version in pubspec.yaml. Version anpassen oder Tag neu setzen."
            exit 1
          fi

      - run: flutter pub get

      - name: APK bauen
        env:
          HAVEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAVEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAVEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Name und Build-Nummer kommen aus pubspec.yaml. Die Build-Nummer muss
          # bei jedem Release steigen, sonst lehnt Android das Update ab.
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "haven-$version.apk"
          echo "APK_FILE=haven-$version.apk" >> "$GITHUB_ENV"

      - name: Release-Text aus der Tag-Nachricht
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP/,$d' > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "NOTES_FILE=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          # Text aus dem annotierten Tag, ohne Text die Liste der Commits
          body_path: ${{ env.NOTES_FILE }}
          generate_release_notes: ${{ env.NOTES_FILE == '' }}
